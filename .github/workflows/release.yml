name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          changelog_version="$(sed -n -E 's/^# ([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CHANGELOG.md | head -n 1)"
          if [ "$TAG" != "$package_version" ] || [ "$TAG" != "$changelog_version" ]; then
            echo "::error::Tag $TAG, package.json $package_version, CHANGELOG.md $changelog_version"
            exit 1
          fi

      - run: npx vitest run
      - run: npm run build

      - name: Publish on the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: emdpbenabkkocjldgifjkciijdmcflin
        run: bash scripts/publish-chrome-store.sh css-battle-toolbox.zip

      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/changelog-section.sh "$TAG" > release-notes.md
          gh release create "$TAG" css-battle-toolbox.zip --title "$TAG" --notes-file release-notes.md --prerelease
