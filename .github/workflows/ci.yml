name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage
      - name: Report the coverage on the pull request
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mutation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the last mutation results, to only test what changed
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.ref }}-
            stryker-refs/heads/master-
      - name: Test again the static mutants that survived, their results can be stale
        run: node scripts/forget-static-survivors.mjs
      - run: npx stryker run
      - name: Upload the HTML report
        id: upload
        if: ${{ !cancelled() && hashFiles('reports/mutation/mutation.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: reports/mutation/mutation-report.html
          archive: false
      - name: Write the mutation summary
        if: ${{ !cancelled() && hashFiles('reports/mutation/mutation.json') != '' }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          node scripts/mutation-summary.mjs reports/mutation/mutation.json "$REPORT_URL" > mutation-summary.md
          cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report the mutation score on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('mutation-summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation
          path: mutation-summary.md
